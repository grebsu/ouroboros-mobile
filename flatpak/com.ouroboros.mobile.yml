app-id: com.ouroboros.mobile
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: ouroboros-mobile-wrapper
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=x11
  - --share=ipc
  - --share=network
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.secrets
  - --filesystem=xdg-run/keyring
  - --filesystem=xdg-config/dconf:ro
  - --metadata=X-DConf=comm/
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: ouroboros-mobile
    buildsystem: simple
    sources:
      - type: dir
        path: ../build/linux/x64/release/bundle
        dest: bundle
      - type: file
        path: ../linux/libs/libsqlite3.so
      - type: file
        path: com.ouroboros.mobile.desktop
      - type: dir
        path: metainfo
        dest: metainfo
      - type: dir
        path: icons
        dest: icons
      - type: file
        path: ouroboros-mobile-wrapper
      - type: dir
        path: libs
        dest: extra-libs
    build-commands:
      # Instalar o executável e bibliotecas
      - install -d /app/bin /app/lib /app/share/applications /app/share/metainfo /app/share/icons/hicolor
      - cp -r bundle/lib/* /app/lib/
      - cp -r extra-libs/* /app/lib/
      - cp -r bundle/data /app/
      - install -m 755 bundle/ouroboros_mobile /app/bin/
      
      # Garantir que o SQLCipher (libsqlite3.so) seja o correto
      - install -m 755 libsqlite3.so /app/lib/
      - ln -sf /app/lib/libsqlite3.so /app/lib/libsqlite3.so.0
      
      # Links simbólicos para o Flutter encontrar os recursos relativo ao binário
      - ln -s /app/lib /app/bin/lib
      - ln -s /app/data /app/bin/data
      
      # O wrapper vai para /app/bin
      - install -m 755 ouroboros-mobile-wrapper /app/bin/
      
      # Instalar metadados
      - install -m 644 com.ouroboros.mobile.desktop /app/share/applications/
      - cp -r metainfo/* /app/share/metainfo/
      
      # Instalar ícones
      - cp -r icons/* /app/share/icons/hicolor/
