name: ouroboros_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.1.2+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_vector_icons: ^2.0.0
  provider: ^6.1.2
  intl: ^0.20.2
  path_provider: ^2.1.5
  uuid: ^4.5.1
  sqflite_sqlcipher: ^3.0.0
  sqflite_common_ffi: ^2.3.0+4
  http: ^1.5.0
  flutter_inappwebview: ^6.1.5
  shared_preferences: ^2.5.3
  collection: ^1.18.0
  fl_chart: ^1.1.1
  file_picker: ^10.3.6
  flutter_svg: ^2.2.2
  permission_handler: ^12.0.1
  image: ^4.5.4
  crypto: ^3.0.3
  encrypt: ^5.0.1 # Adicionado para criptografia em nível de app se necessário

  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.0
  network_info_plus: ^5.0.3
  multicast_dns: ^0.3.2
  flutter_secure_storage: ^9.0.0
  bcrypt: ^1.2.0
  sqlite3: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  very_good_analysis: ^5.1.0
  dart_code_metrics_presets: ^2.0.0
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "logo/logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#009688"

flutter:
  uses-material-design: true

  assets:
    - logo/
    - assets/data/
